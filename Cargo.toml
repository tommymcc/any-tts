[package]
name = "any-tts"
version = "0.2.0"
edition = "2021"
rust-version = "1.83"
description = "A Rust TTS library with Candle backends and runtime adapters for modern open TTS models"
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://flow-like.com"
documentation = "https://docs.rs/any-tts"
repository = "https://github.com/TM9657/any-tts"
keywords = ["tts", "text-to-speech", "candle", "ml", "audio"]
categories = ["multimedia::audio", "science"]
include = [
	"/README.md",
	"/CODE_OF_CONDUCT.md",
	"/CONTRIBUTING.md",
	"/SECURITY.md",
	"/SUPPORT.md",
	"/examples/**",
	"/src/**",
	"/tests/**",
]

[package.metadata.docs.rs]
no-default-features = true
features = ["download"]

[[example]]
name = "benchmark_omnivoice"
required-features = ["omnivoice"]

[[example]]
name = "generate_kokoro"
required-features = ["kokoro"]

[[example]]
name = "generate_omnivoice"
required-features = ["omnivoice"]

[[example]]
name = "generate_qwen3_tts"
required-features = ["qwen3-tts"]

[[example]]
name = "quick_test_qwen3"
required-features = ["qwen3-tts"]

[[example]]
name = "generate_vibevoice"
required-features = ["vibevoice"]

[[example]]
name = "generate_vibevoice_realtime"
required-features = ["vibevoice"]

[[example]]
name = "generate_voxtral"
required-features = ["voxtral"]

[[test]]
name = "test_kokoro"
required-features = ["kokoro"]

[[test]]
name = "test_omnivoice"
required-features = ["omnivoice"]

[[test]]
name = "test_qwen3_tts"
required-features = ["qwen3-tts"]

[features]
default = ["qwen3-tts", "kokoro", "omnivoice", "vibevoice", "voxtral", "download"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]
# AMD GPUs through burn's ROCm backend. OmniVoice runs its transformer backbone
# there and everything else on candle's CPU device. Needs ROCm (HIP 7.1) at run
# time, and Rust 1.92+ to build.
rocm = ["dep:burn", "burn/rocm", "burn/cubecl", "burn/fusion", "burn/extension", "dep:burn-core", "dep:burn-cubecl", "dep:libloading", "omnivoice"]
qwen3-tts = []
kokoro = ["dep:kana2phone", "dep:lindera", "dep:pinyin", "dep:fancy-regex", "dep:unicode-normalization"]
omnivoice = ["dep:unicode-general-category"]
vibevoice = []
voxtral = []
download = ["dep:reqwest"]

[dependencies]
# For the `rocm` feature. The same burn as parakeet-rs (tommymcc fork, branch burn-0.23).
burn = { version = "=0.23.0-pre.2", optional = true, default-features = false, features = ["std"] }
# Only for its `persistence` feature, which burn doesn't forward: CubeCL can cache
# compiled kernels on disk only with it.
burn-core = { version = "=0.23.0-pre.2", optional = true, default-features = false, features = ["persistence"] }
# For the `rocm` feature's hipBLAS matmul (src/hipblas.rs): burn's CubeCL
# backend and its tensors, which burn doesn't re-export, and loading hipBLAS
# at run time so it stays optional.
burn-cubecl = { version = "=0.23.0-pre.2", optional = true, default-features = false, features = ["hip"] }
libloading = { version = "0.8", optional = true }
fancy-regex = { version = "0.17", optional = true }
unicode-normalization = { version = "0.1", optional = true }
unicode-general-category = { version = "1", optional = true }
base64 = "0.22"
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
rustc-hash = "1.1"
rustfft = "6"
safetensors = "0.7.0"
nanomp3 = "0.1.1"
tiktoken-rs = "0.9.1"
tokenizers = "0.22.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
zip = { version = "7.2", default-features = false }
kana2phone = { version = "0.3", optional = true }
lindera = { version = "2.3.4", default-features = false, features = ["embed-ipadic"], optional = true }
pinyin = { version = "0.11", default-features = false, features = ["plain", "with_tone_num_end"], optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
hound = "3.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"

# Fixes from forks, for building this crate on its own; a crate that depends on
# any-tts needs its own copies. gemm 0.19 panics on CPUs with FMA but no AVX2;
# pliron 0.19 (under burn) can resolve to a hashbrown too old to build with;
# cubecl-hip-sys has no bindings for Ubuntu 26.04's HIP (52801).
[patch.crates-io]
gemm-common = { git = "https://github.com/tommymcc/gemm", rev = "dbdcb05011089a25f1b4d34e89eee4504b61f605" }
gemm-f16 = { git = "https://github.com/tommymcc/gemm", rev = "dbdcb05011089a25f1b4d34e89eee4504b61f605" }
pliron = { git = "https://github.com/tommymcc/pliron", rev = "ac2cc0c820907013df7d955be7da370a7b8b2c2f" }
cubecl-hip-sys = { git = "https://github.com/tommymcc/cubecl-hip-sys", rev = "26e8dea1b9ae2a362f28ed2aadf67f25d2022acb" }
cubecl-hip = { path = "../forks/cubecl-hip-0.12" }
